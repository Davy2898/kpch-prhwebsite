<!doctype html>
<html lang="km">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="csrf-token" content="{{ csrf_token() }}" />
    <title>{{ og.title if og and og.title else 'មន្ទីរពេទ្យខេត្តកំពង់ឆ្នាំង' }}</title>

    <!-- SEO & Social Open Graph Meta Tags -->
    <meta name="description" content="{{ og.description if og and og.description else 'ព័ត៌មាន និងសេចក្តីជូនដំណឹងពីមន្ទីរពេទ្យបង្អែកខេត្តកំពង់ឆ្នាំង' }}" />
    <meta property="og:site_name" content="{{ og.site_name if og and og.site_name else 'មន្ទីរពេទ្យបង្អែកខេត្តកំពង់ឆ្នាំង' }}" />
    <meta property="og:type" content="{{ og.type if og and og.type else 'website' }}" />
    <meta property="og:title" content="{{ og.title if og and og.title else 'មន្ទីរពេទ្យខេត្តកំពង់ឆ្នាំង' }}" />
    <meta property="og:description" content="{{ og.description if og and og.description else 'ព័ត៌មាន និងសេចក្តីជូនដំណឹងពីមន្ទីរពេទ្យបង្អែកខេត្តកំពង់ឆ្នាំង' }}" />
    <meta property="og:image" content="{{ og.image if og and og.image else url_for('static', filename='img/kampongchhnangentry.jpg', _external=True) }}" />
    <meta property="og:url" content="{{ og.url if og and og.url else request.base_url }}" />
    <meta property="og:locale" content="{{ og.locale if og and og.locale else 'km_KH' }}" />
    {% if og and og.published_time %}
    <meta property="article:published_time" content="{{ og.published_time }}" />
    {% endif %}

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ og.title if og and og.title else 'មន្ទីរពេទ្យខេត្តកំពង់ឆ្នាំង' }}" />
    <meta name="twitter:description" content="{{ og.description if og and og.description else 'ព័ត៌មាន និងសេចក្តីជូនដំណឹងពីមន្ទីរពេទ្យបង្អែកខេត្តកំពង់ឆ្នាំង' }}" />
    <meta name="twitter:image" content="{{ og.image if og and og.image else url_for('static', filename='img/kampongchhnangentry.jpg', _external=True) }}" />
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo.svg') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kantumruy+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='vue/assets/app.css') }}?v=202609191355" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="{{ url_for('static', filename='vue/assets/app.js') }}?v=202609191355"></script>
  </body>
</html>
