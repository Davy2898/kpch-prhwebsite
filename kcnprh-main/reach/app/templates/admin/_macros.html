{% macro edit_button(url, label='Edit') -%}
<a href="{{ url }}"
   class="inline-flex items-center gap-1 rounded-md border border-blue-200 bg-blue-50/50 text-blue-700 hover:bg-blue-100 hover:border-blue-300 dark:border-sky-700/50 dark:bg-sky-900/30 dark:text-sky-300 dark:hover:bg-sky-900/50 px-2.5 py-1 text-xs font-medium shadow-sm">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-3.5 w-3.5">
    <path d="M13.586 3.586a2 2 0 0 1 2.828 2.828l-8.486 8.486a4 4 0 0 1-1.414.943l-2.12.848a.5.5 0 0 1-.652-.652l.848-2.12a4 4 0 0 1 .943-1.414l8.486-8.486Z"/>
    <path d="M5 13l2 2"/>
  </svg>
  <span>{{ label }}</span>
</a>
{%- endmacro %}

{% macro delete_button(action_url, csrf_token_value, confirm_text='Delete this item?', label='Delete') -%}
<form class="inline" method="post" action="{{ action_url }}" onsubmit="return confirm('{{ confirm_text }}');">
  <input type="hidden" name="csrf_token" value="{{ csrf_token_value }}" />
  <button type="submit"
          class="inline-flex items-center gap-1 rounded-md border border-red-200 bg-red-50/60 text-red-700 hover:bg-red-100 hover:border-red-300 dark:border-red-800/60 dark:bg-red-900/30 dark:text-red-300 dark:hover:bg-red-900/50 px-2.5 py-1 text-xs font-medium shadow-sm">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-3.5 w-3.5">
      <path fill-rule="evenodd" d="M8.5 3a1.5 1.5 0 0 1 3 0V4h4a.75.75 0 0 1 0 1.5h-.51l-.637 9.095A2.75 2.75 0 0 1 11.61 17H8.39a2.75 2.75 0 0 1-2.742-2.405L5.01 5.5H4.5A.75.75 0 0 1 4.5 4h4V3Zm-2.982 2.5h8.964l-.62 8.865a1.25 1.25 0 0 1-1.246 1.135H8.384a1.25 1.25 0 0 1-1.246-1.135L5.518 5.5Z" clip-rule="evenodd"/>
    </svg>
    <span>{{ label }}</span>
  </button>
</form>
{%- endmacro %}
