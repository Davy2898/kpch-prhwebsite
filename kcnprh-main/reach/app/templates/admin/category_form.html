{% extends "base.html" %}
{% block title %}{{ 'Edit' if category else 'New' }} Category - Admin{% endblock %}
{% block content %}
  <div class="admin-page">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-2xl font-semibold">{{ 'Edit' if category else 'New' }} Category</h2>
      <a class="text-sm text-blue-600 hover:underline" href="{{ url_for('admin.categories_list') }}">Back to Categories</a>
    </div>
    <form method="post" class="space-y-6 max-w-2xl rounded-xl border border-slate-200 dark:border-slate-700 bg-white/90 dark:bg-slate-900/50 shadow p-6">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Name</label>
        <input class="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-white/90 dark:bg-slate-900/60 px-3 py-2 outline-none focus:ring-4 focus:ring-emerald-500/30 focus:border-emerald-500" type="text" name="CategoryName" value="{{ category.CategoryName if category else '' }}" required />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Description</label>
        <textarea class="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-white/90 dark:bg-slate-900/60 px-3 py-2 outline-none focus:ring-4 focus:ring-emerald-500/30 focus:border-emerald-500" name="Description" rows="4">{{ category.Description if category else '' }}</textarea>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Active</label>
        <select class="w-full sm:w-40 rounded-lg border border-slate-200 dark:border-slate-700 bg-white/90 dark:bg-slate-900/60 px-3 py-2 outline-none focus:ring-4 focus:ring-emerald-500/30 focus:border-emerald-500" name="Is_Active">
          <option value="1" {% if category and category.Is_Active %}selected{% endif %}>Yes</option>
          <option value="0" {% if category and not category.Is_Active %}selected{% endif %}>No</option>
        </select>
      </div>
      <div class="flex items-center gap-3 pt-2">
        <button class="inline-flex items-center gap-1 rounded-md border border-emerald-700/20 bg-emerald-600 text-white hover:bg-emerald-700 px-4 py-2 text-sm font-medium shadow-sm" type="submit">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-4 w-4"><path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 0 1 .143 1.052l-7.5 9.5a.75.75 0 0 1-1.094.077l-4-4a.75.75 0 1 1 1.06-1.06l3.38 3.38 6.988-8.853a.75.75 0 0 1 1.023-.096Z" clip-rule="evenodd"/></svg>
          <span>Save</span>
        </button>
        <a href="{{ url_for('admin.categories_list') }}" class="inline-flex items-center gap-1 rounded-md border border-slate-200 dark:border-slate-700 px-4 py-2 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-4 w-4"><path fill-rule="evenodd" d="M12.03 4.97a.75.75 0 0 1 0 1.06L9.06 9l2.97 2.97a.75.75 0 0 1-1.06 1.06l-3.5-3.5a.75.75 0 0 1 0-1.06l3.5-3.5a.75.75 0 0 1 1.06 0Z" clip-rule="evenodd"/></svg>
          <span>Cancel</span>
        </a>
      </div>
    </form>
  </div>
{% endblock %}
