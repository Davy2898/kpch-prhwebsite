{% extends "base.html" %}
{% block title %}Admin Login - Reach{% endblock %}
{% block content %}
  <section class="min-h-[60vh] flex items-center justify-center px-4">
    <div class="w-full max-w-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-white/90 dark:bg-slate-900/50 shadow p-6">
      <div class="text-center">
        <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100">Admin Login</h1>
        <p class="mt-1 text-sm text-slate-600 dark:text-slate-400">Sign in to manage content</p>
      </div>
      <form method="post" class="mt-5 space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div>
          <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Username</label>
          <input class="mt-1 w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-white/90 dark:bg-slate-900/60 px-3 py-2 outline-none focus:ring-4 focus:ring-emerald-500/30 focus:border-emerald-500" type="text" name="username" required />
        </div>
        <div>
          <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Password</label>
          <input class="mt-1 w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-white/90 dark:bg-slate-900/60 px-3 py-2 outline-none focus:ring-4 focus:ring-emerald-500/30 focus:border-emerald-500" type="password" name="password" required />
        </div>
        <button class="w-full inline-flex items-center justify-center rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm px-4 py-2 shadow" type="submit">Login</button>
      </form>
    </div>
  </section>
{% endblock %}
